<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full Brain</title><style>:root{--bg:#071018;--panel:#0e1925;--line:#26384a;--text:#f6f7f9;--muted:#9eb0c3;--green:#35d47b;--blue:#67b7ff;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:var(--blue);text-decoration:none;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}select,input{background:#09131e;color:white;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}input{flex:1;min-width:220px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#101d2b}.item.active{border-color:var(--green)}.title{font-size:17px;font-weight:850}.meta,.detail,.status{color:var(--muted);margin-top:5px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-right:5px;font-size:12px}.activePill{color:#76f0a9}.count{color:var(--muted)}h1{margin:0}.empty{padding:30px;text-align:center;color:var(--muted)}.kind{font-weight:850}.rule{color:#9fd3ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:#132131;color:#fff;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}.done{background:#173428;color:#9dffbf}.obsolete{color:#ffd58a}.delete{color:#ff9a9a;border-color:#56313a}.btn:disabled{opacity:.45;cursor:wait}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>🧠 Full Brain</h1><div class="count" id="count">Loading Brain…</div></div><a class="back" href="./">← Daily 6</a></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search actions, rules, ideas, references…"><select id="area"><option value="">All areas</option><option>ELV</option><option>Gray's</option><option>Personal</option><option>Family</option><option>Idea</option><option>Other</option></select><select id="kind"><option value="">All memory types</option><option value="action">Actions</option><option value="operating_rule">Operating Rules</option><option value="reference">Reference</option><option value="idea">Ideas</option></select></div><div id="list"></div><div class="status" id="status"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const PROJECT='https://uvzivnoljpdgmasuzqqv.supabase.co',KEY='sb_publishable_1PxDso9FzMFRZDOySb6qbg_KmGa0-wh',SERVICE=PROJECT+'/functions/v1/mobile-service';
const sb=supabase.createClient(PROJECT,KEY),q=id=>document.getElementById(id);let session=null,items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(body){if(!session)throw Error('Sign in first.');const r=await fetch(SERVICE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function label(k){return ({action:'Action',operating_rule:'Operating Rule',reference:'Reference',idea:'Idea'})[k]||k||'Action'}
function render(){const s=q('search').value.toLowerCase().trim(),a=q('area').value,k=q('kind').value;const f=items.filter(x=>(!a||x.area===a)&&(!k||(x.brain_kind||'action')===k)&&(!s||[x.title,x.next_action,x.context,x.trigger_context,x.area,x.brain_kind].join(' ').toLowerCase().includes(s)));q('count').textContent=`${items.length} open memories • ${f.length} showing`;q('list').innerHTML=f.length?f.map(x=>{const kind=x.brain_kind||'action',isAction=kind==='action';return `<div class="item ${x.is_now?'active':''}"><div class="title">${esc(x.title)}</div><div class="meta"><span class="pill kind ${kind==='operating_rule'?'rule':''}">${esc(label(kind))}</span><span class="pill">${esc(x.area)}</span>${isAction?`<span class="pill">${esc(x.priority_label)} ${esc(x.priority_score)}</span>`:''}${x.daily_date&&isAction?'<span class="pill">Daily 6</span>':''}${x.is_now?'<span class="pill activePill">▶ IN PROGRESS</span>':''}</div>${kind==='operating_rule'?`<div class="detail"><b>When:</b> ${esc(x.trigger_context||'Context not set yet')}</div><div class="detail">${esc(x.context||x.next_action||'')}</div>`:isAction?`<div class="detail"><b>Next:</b> ${esc(x.next_action||'')}</div>`:`<div class="detail">${esc(x.context||x.next_action||'')}</div>`}<div class="actions">${isAction?`<button class="btn done" onclick="markDone('${x.id}')">✓ Done</button>`:''}<button class="btn obsolete" onclick="markObsolete('${x.id}')">✕ No Longer Needed</button><button class="btn delete" onclick="deleteItem('${x.id}')">🗑 Delete</button></div></div>`}).join(''):'<div class="empty">Nothing matches this view.</div>'}
async function load(){try{q('status').textContent='';const d=await api({action:'backlog'});items=d.items||[];render()}catch(e){q('status').textContent=e.message}}
window.markDone=async id=>{try{q('status').textContent='Marking complete…';await api({action:'complete',item_id:id});await load()}catch(e){q('status').textContent=e.message}};
window.markObsolete=async id=>{if(!confirm('Mark this as No Longer Needed? It will leave the active Brain but stay in history.'))return;try{q('status').textContent='Removing from active Brain…';await api({action:'obsolete',item_id:id});await load()}catch(e){q('status').textContent=e.message}};
window.deleteItem=async id=>{if(!confirm('Permanently delete this item? Use this only for junk, tests, or true duplicates.'))return;try{q('status').textContent='Deleting…';await api({action:'delete',item_id:id});await load()}catch(e){q('status').textContent=e.message}};
q('search').oninput=render;q('area').onchange=render;q('kind').onchange=render;
(async()=>{const {data}=await sb.auth.getSession();session=data.session;if(!session){location.replace('./');return}await load()})();
</script></body></html>
