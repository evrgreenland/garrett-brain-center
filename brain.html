<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full Brain</title><style>:root{--bg:#071018;--panel:#0e1925;--line:#26384a;--text:#f6f7f9;--muted:#9eb0c3;--green:#35d47b;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:var(--blue);text-decoration:none;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}select,input{background:#09131e;color:white;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}input{flex:1;min-width:220px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#101d2b}.item.active{border-color:var(--green)}.title{font-size:17px;font-weight:850}.meta,.next,.status{color:var(--muted);margin-top:5px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-right:5px;font-size:12px}.activePill{color:#76f0a9}.count{color:var(--muted)}h1{margin:0}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>🧠 Full Brain</h1><div class="count" id="count">Loading open items…</div></div><a class="back" href="./">← Daily 6</a></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search the Brain…"><select id="area"><option value="">All areas</option><option>ELV</option><option>Gray's</option><option>Personal</option><option>Family</option><option>Idea</option><option>Other</option></select><select id="type"><option value="">All types</option><option>task</option><option>project</option><option>reminder</option><option>waiting</option><option>decision</option><option>idea</option></select></div><div id="list"></div><div class="status" id="status"></div></div></div><script>
const ENDPOINT='https://uvzivnoljpdgmasuzqqv.supabase.co/functions/v1/dynamic-service',q=id=>document.getElementById(id),key=()=>localStorage.getItem('brain_supabase_key')||'';let items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(body){const k=key();if(!k)throw Error('Open Daily 6 first and save your Supabase key in Settings.');const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k,'apikey':k},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function render(){const s=q('search').value.toLowerCase().trim(),a=q('area').value,t=q('type').value;const f=items.filter(x=>(!a||x.area===a)&&(!t||x.item_type===t)&&(!s||[x.title,x.next_action,x.context,x.area].join(' ').toLowerCase().includes(s)));q('count').textContent=`${items.length} open items • ${f.length} showing`;q('list').innerHTML=f.length?f.map(x=>`<div class="item ${x.is_now?'active':''}"><div class="title">${esc(x.title)}</div><div class="meta"><span class="pill">${esc(x.area)}</span><span class="pill">${esc(x.item_type)}</span><span class="pill">${esc(x.priority_label)} ${esc(x.priority_score)}</span>${x.daily_date?'<span class="pill">Daily 6</span>':''}${x.is_now?'<span class="pill activePill">▶ IN PROGRESS</span>':''}</div><div class="next"><b>Next:</b> ${esc(x.next_action||'')}</div></div>`).join(''):'<div class="empty">Nothing matches this view.</div>'}async function load(){try{const d=await api({action:'backlog'});items=d.items||[];render()}catch(e){q('status').textContent=e.message}}q('search').oninput=render;q('area').onchange=render;q('type').onchange=render;load();
</script></body></html>
