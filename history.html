<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Brain Center History</title><style>
:root{--bg:#071018;--panel:#0e1925;--panel2:#101d2b;--line:#26384a;--text:#f6f7f9;--muted:#9eb0c3;--green:#35d47b;--blue:#67b7ff;--yellow:#ffd58a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 12px 80px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:22px}h1,h2,h3{margin:0}.sub,.meta{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:13px}.day{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:11px}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.num{font-size:24px;font-weight:900}.good{color:var(--green)}.warn{color:var(--yellow)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--muted);margin:4px 5px 0 0}.items{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.item{padding:7px 0;border-top:1px solid rgba(38,56,74,.65)}.item:first-child{border-top:0}.done{color:#8df4b5}.carry{color:#ffd58a}.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#132131;color:white;border-radius:12px;padding:10px 13px;font-weight:850}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">🧠</div><div><h1>Daily History</h1><div class="sub">What was planned, finished, and carried</div></div></div><a class="btn" href="./">Brain</a></div><section class="card"><div id="body" class="sub">Loading history…</div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const PROJECT='https://uvzivnoljpdgmasuzqqv.supabase.co',KEY='sb_publishable_1PxDso9FzMFRZDOySb6qbg_KmGa0-wh',HIST=PROJECT+'/functions/v1/history-service';const sb=supabase.createClient(PROJECT,KEY),q=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function prettyDate(d){return new Date(d+'T12:00:00').toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}
function renderDay(x){const done=new Set((x.completed_items||[]).map(i=>String(i.id)));const removed=new Set((x.removed_items||[]).map(i=>String(i.id)));const area=Object.entries(x.areas||{}).map(([k,v])=>`<span class="pill">${esc(k)} ${esc(v.completed)}/${esc(v.planned)}</span>`).join('');const rows=(x.planned_items||[]).map(i=>{const id=String(i.id),isDone=done.has(id),isRemoved=removed.has(id);const icon=isDone?'✓':isRemoved?'×':'↷',cls=isDone?'done':isRemoved?'sub':'carry',label=isDone?'completed':isRemoved?'not needed':'carried';return `<div class="item"><div class="${cls}"><b>${icon} ${esc(i.title)}</b></div><div class="meta">${esc(i.area)} • ${label}${i.estimated_minutes?' • ~'+esc(i.estimated_minutes)+' min':''}</div></div>`}).join('');return `<div class="day"><div class="head"><div><h3>${esc(prettyDate(x.date))}</h3><div class="meta">Started ${x.started_at?esc(new Date(x.started_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})):'—'}</div></div><div>${area}</div></div><div class="stats"><div class="stat"><div class="num">${esc(x.planned_count)}</div><div class="meta">planned</div></div><div class="stat"><div class="num good">${esc(x.completed_count)}</div><div class="meta">completed</div></div><div class="stat"><div class="num ${x.carried_count?'warn':''}">${esc(x.carried_count)}</div><div class="meta">carried</div></div></div><div class="items">${rows||'<div class="sub">No planned items.</div>'}</div></div>`}
async function boot(){const{data}=await sb.auth.getSession(),s=data.session;if(!s){q('body').innerHTML='Sign in through <a href="./" style="color:#67b7ff">Brain Center</a> first.';return}try{const r=await fetch(HIST,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token,apikey:KEY},body:JSON.stringify({action:'history',days:14})}),d=await r.json();if(!r.ok)throw Error(d.error||'History failed');if(!(d.history||[]).length){q('body').innerHTML='<b>History recorder is ready.</b><div class="meta" style="margin-top:7px">Your next Daily Reset will become the first trustworthy snapshot. Today’s reset happened before history recording was installed, so the Brain is intentionally not inventing a morning plan.</div>';return}q('body').innerHTML=(d.history||[]).map(renderDay).join('')}catch(e){q('body').textContent=e.message}}
boot();
</script></body></html>
