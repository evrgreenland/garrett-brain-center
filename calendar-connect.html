<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Connect Calendar • Brain Center</title><style>:root{--bg:#071018;--panel:#0e1925;--line:#26384a;--text:#f6f7f9;--muted:#9eb0c3;--green:#35d47b;--red:#ff6b6b;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:32px 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:18px}h1{margin:0}.sub,.status,.meta{color:var(--muted)}button,a{border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:850;cursor:pointer;text-decoration:none}.connect{background:var(--green);color:#04120a;border-color:var(--green)}.test{background:var(--blue);color:#06111a;border-color:var(--blue)}.back{background:#132131;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:#fbd75b}.event{border-top:1px solid var(--line);padding:12px 0}.event:first-child{border-top:0}.eventTitle{font-weight:850}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-right:6px;font-size:12px;color:var(--muted)}#results{display:none}#results.show{display:block}</style></head><body><div class="wrap"><h1>🧠 Brain Center</h1><div class="sub">Google Calendar connection</div><div class="card"><h2 id="title">Connect Google Calendar</h2><p id="copy" class="sub">Brain Center requests read-only calendar access so it can protect hard commitments and understand your available work windows.</p><div id="status" class="status"></div><div class="row"><button id="connect" class="connect">CONNECT GOOGLE CALENDAR</button><button id="testBtn" class="test">TEST CALENDAR READ</button><a class="back" href="./">BACK TO BRAIN CENTER</a></div></div><div class="card" id="results"><h2>Calendar read test</h2><div id="summary" class="sub"></div><div id="nextHard" style="margin-top:14px"></div><div id="events" style="margin-top:14px"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const PROJECT_URL='https://uvzivnoljpdgmasuzqqv.supabase.co';
const CAL_SERVICE=PROJECT_URL+'/functions/v1/calendar-service';
const REDIRECT='https://evrgreenland.github.io/garrett-brain-center/calendar-connect.html';
const key=localStorage.getItem('brain_supabase_key')||'';
const statusEl=document.getElementById('status'),connectBtn=document.getElementById('connect'),testBtn=document.getElementById('testBtn');
function status(msg,cls=''){statusEl.textContent=msg;statusEl.className='status '+cls}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(!key){status('Brain Center publishable key is missing in this browser. Open the main Brain Center first and save the key in Settings.','err');connectBtn.disabled=true;testBtn.disabled=true}
const client=key?supabase.createClient(PROJECT_URL,key):null;
async function registerSession(session){if(!session?.access_token)return false;if(!session.provider_refresh_token){status('Google is signed in, but the long-lived calendar token is missing. Click RECONNECT once so Google can grant offline calendar access.','warn');return false}status('Securing calendar connection with Brain Center…');const r=await fetch(CAL_SERVICE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':key},body:JSON.stringify({action:'register',refresh_token:session.provider_refresh_token,google_email:session.user?.email||''})});const d=await r.json();if(!r.ok){status(d.error||'Could not register calendar connection.','err');return false}status('✓ Google Calendar securely connected to Brain Center','ok');return true}
async function getSession(){if(!client)return null;const {data,error}=await client.auth.getSession();if(error){status(error.message,'err');return null}return data.session||null}
function renderSchedule(d){document.getElementById('results').classList.add('show');document.getElementById('summary').textContent=`Connected as ${d.connected_as||'Google user'} • ${d.calendars?.length||0} owned/writable calendars • ${d.events?.length||0} events in the next 7 days`;const nh=d.next_hard;document.getElementById('nextHard').innerHTML=nh?`<div class="eventTitle">🔴 Next hard commitment: ${esc(nh.summary)}</div><div class="meta">${esc(nh.start)} • ${esc(nh.calendar_name||'')}</div>`:`<div class="meta">No red hard commitment found in the next 7 days.</div>`;const evs=(d.events||[]).slice(0,12);document.getElementById('events').innerHTML=evs.length?evs.map(e=>`<div class="event"><div class="eventTitle">${esc(e.summary)}</div><div class="meta">${esc(e.start)} • ${esc(e.calendar_name||'')}</div><div style="margin-top:6px"><span class="pill">${esc(e.commitment)}</span><span class="pill">${esc(e.type)}</span>${e.color_id?`<span class="pill">color ${esc(e.color_id)}</span>`:''}</div></div>`).join(''):'<div class="meta">No upcoming events returned.</div>'}
async function testCalendar(){const session=await getSession();if(!session){status('Google session not found. Reconnect Google Calendar first.','warn');return}testBtn.disabled=true;status('Reading your calendars…');try{const r=await fetch(CAL_SERVICE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':key},body:JSON.stringify({action:'schedule'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Calendar read failed');renderSchedule(d);status('✓ Brain Center is reading your Google Calendar','ok')}catch(e){status('Calendar test error: '+e.message,'err')}finally{testBtn.disabled=false}}
async function checkSession(){const session=await getSession();if(session){document.getElementById('title').textContent='Google Calendar connected';document.getElementById('copy').textContent='Authorization succeeded. Brain Center can now use this Google account for calendar intelligence.';connectBtn.textContent='RECONNECT GOOGLE CALENDAR';const ok=await registerSession(session);if(ok)await testCalendar();}}
connectBtn.onclick=async()=>{if(!client)return;status('Opening Google authorization…');const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:REDIRECT,scopes:'https://www.googleapis.com/auth/calendar.readonly',queryParams:{access_type:'offline',prompt:'consent'}}});if(error)status(error.message,'err')};
testBtn.onclick=testCalendar;
checkSession();
</script></body></html>
