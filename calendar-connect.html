<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Connect Calendar • Brain Center</title><style>:root{--bg:#071018;--panel:#0e1925;--line:#26384a;--text:#f6f7f9;--muted:#9eb0c3;--green:#35d47b;--red:#ff6b6b;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:680px;margin:0 auto;padding:32px 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:18px}h1{margin:0}.sub,.status{color:var(--muted)}button,a{border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:850;cursor:pointer;text-decoration:none}.connect{background:var(--green);color:#04120a;border-color:var(--green)}.back{background:#132131;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:#fbd75b}.hidden{display:none}</style></head><body><div class="wrap"><h1>🧠 Brain Center</h1><div class="sub">Google Calendar connection</div><div class="card"><h2 id="title">Connect Google Calendar</h2><p id="copy" class="sub">Brain Center requests read-only calendar access so it can protect hard commitments and understand your available work windows.</p><div id="status" class="status"></div><div class="row"><button id="connect" class="connect">CONNECT GOOGLE CALENDAR</button><a class="back" href="./">BACK TO BRAIN CENTER</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const PROJECT_URL='https://uvzivnoljpdgmasuzqqv.supabase.co';
const CAL_SERVICE=PROJECT_URL+'/functions/v1/calendar-service';
const REDIRECT='https://evrgreenland.github.io/garrett-brain-center/calendar-connect.html';
const key=localStorage.getItem('brain_supabase_key')||'';
const statusEl=document.getElementById('status'),connectBtn=document.getElementById('connect');
function status(msg,cls=''){statusEl.textContent=msg;statusEl.className='status '+cls}
if(!key){status('Brain Center publishable key is missing in this browser. Open the main Brain Center first and save the key in Settings.','err');connectBtn.disabled=true}
const client=key?supabase.createClient(PROJECT_URL,key):null;
async function registerSession(session){if(!session?.access_token)return false;if(!session.provider_refresh_token){status('Google is signed in, but the long-lived calendar token is missing. Click RECONNECT once so Google can grant offline calendar access.','warn');return false}status('Securing calendar connection with Brain Center…');const r=await fetch(CAL_SERVICE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':key},body:JSON.stringify({action:'register',refresh_token:session.provider_refresh_token,google_email:session.user?.email||''})});const d=await r.json();if(!r.ok){status(d.error||'Could not register calendar connection.','err');return false}status('✓ Google Calendar securely connected to Brain Center','ok');return true}
async function checkSession(){if(!client)return;const {data,error}=await client.auth.getSession();if(error){status(error.message,'err');return}if(data.session){document.getElementById('title').textContent='Google Calendar connected';document.getElementById('copy').textContent='Authorization succeeded. Brain Center can now use this Google account for calendar intelligence.';connectBtn.textContent='RECONNECT GOOGLE CALENDAR';await registerSession(data.session);}}
connectBtn.onclick=async()=>{if(!client)return;status('Opening Google authorization…');const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:REDIRECT,scopes:'https://www.googleapis.com/auth/calendar.readonly',queryParams:{access_type:'offline',prompt:'consent'}}});if(error)status(error.message,'err')};
checkSession();
</script></body></html>
