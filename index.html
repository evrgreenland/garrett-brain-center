<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Garrett Brain Center</title><style>:root{--bg:#071018;--panel:#0e1925;--panel2:#101d2b;--line:#26384a;--text:#f6f7f9;--muted:#9eb0c3;--green:#35d47b;--red:#ff6b6b;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1040px;margin:auto;padding:24px 16px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center}.topBtns{display:flex;gap:8px;align-items:center}.logo{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:24px}h1{margin:0}.sub,.meta,.reason{color:var(--muted)}.gear,.btn,.record,.brainLink{border:1px solid var(--line);background:#132131;color:white;border-radius:11px;cursor:pointer}.gear{padding:11px 14px;font-size:18px}.brainLink{padding:11px 13px;text-decoration:none;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section h2{margin:0}.badge{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px;font-weight:800}.dailyGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.biz{background:#0b1520;border:1px solid var(--line);border-radius:16px;padding:14px}.bizHead{display:flex;justify-content:space-between;align-items:center}.dailyItem{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:9px}.dailyItem.done{opacity:.55}.dailyItem.active{border-color:#35d47b;box-shadow:0 0 0 1px #35d47b inset;background:#11251d}.activePill{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:999px;background:#173428;color:#76f0a9;font-size:12px;font-weight:900}.dailyTitle{font-weight:850;font-size:16px}.rowBtns{display:flex;gap:8px;margin-top:10px}.btn{padding:9px 11px;font-weight:800}.primary{background:var(--green);border-color:var(--green);color:#04120a}.doneBtn{background:#173428}.bigNext{width:100%;height:58px;background:var(--blue);color:#06111a;border:0;border-radius:14px;font-weight:950;font-size:17px;cursor:pointer}.nextCard{display:none;background:#102334;border:1px solid #31506d;border-radius:16px;padding:16px;margin-top:14px}.nextCard.show{display:block}.nextTitle{font-size:20px;font-weight:900;margin-top:5px}textarea{width:100%;min-height:150px;background:#09131e;color:white;border:1px solid var(--line);border-radius:15px;padding:15px;font-size:17px;line-height:1.5;resize:vertical}.micRow{display:flex;align-items:center;gap:8px;margin-top:10px}select,input{background:#09131e;color:white;border:1px solid var(--line);border-radius:9px;padding:9px}.captureActions{display:grid;grid-template-columns:110px 1fr;gap:10px;margin-top:12px}.record,.capture{height:56px;font-weight:900}.record.live{background:#44212a}.capture{border:0;border-radius:14px;background:var(--green);color:#04120a;cursor:pointer}.status{min-height:22px;margin-top:10px;color:var(--muted)}.ok{color:var(--green)}.err{color:var(--red)}.saveToast{display:none;margin-top:12px;border:1px solid #28563d;background:#0e2119;border-radius:13px;padding:12px 14px}.saveToast.show{display:block}.saveTitle{font-weight:900}.saveMeta{color:#9eb0c3;font-size:13px;margin-top:3px}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalBox{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.modalBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.note{font-size:12px;color:var(--muted);margin-top:8px}.footer{text-align:center;color:#6f8294;font-size:12px;margin-top:22px}@media(max-width:720px){.dailyGrid{grid-template-columns:1fr}.wrap{padding:16px 12px 54px}.card{padding:15px}.captureActions{grid-template-columns:92px 1fr}.brainLink{padding:10px;font-size:13px}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">🧠</div><div><h1>Brain Center</h1><div class="sub">Capture everything. Execute the Daily 6.</div></div></div><div class="topBtns"><a class="brainLink" href="./brain.html">FULL BRAIN</a><button class="gear" id="gear">⚙️</button></div></div><section class="card"><div class="section"><h2>Today's Daily 6</h2><span class="badge" id="dateBadge">Today</span></div><div class="dailyGrid"><div class="biz"><div class="bizHead"><h3>🌲 ELV</h3><span class="meta" id="elvProgress">0/3</span></div><div id="elvList"></div></div><div class="biz"><div class="bizHead"><h3>🌳 Gray's</h3><span class="meta" id="graysProgress">0/3</span></div><div id="graysList"></div></div></div><div style="margin-top:14px"><button class="bigNext" id="nextBtn">⚡ WHAT'S UP NEXT?</button></div><div class="nextCard" id="nextCard"><div class="meta">BEST NEXT ACTION</div><div class="nextTitle" id="nextTitle"></div><div class="meta" id="nextMeta"></div><div class="reason" id="nextReason"></div><div class="rowBtns"><button class="btn primary" id="nextStart">START</button><button class="btn doneBtn" id="nextDone">✓ DONE</button></div></div></section><section class="card"><div class="section"><h2>What's in your head?</h2><span class="badge">voice + text</span></div><textarea id="dump" placeholder="Blurt it out. Don't organize it. That's the Brain's job."></textarea><div class="micRow"><span class="meta">Mic:</span><select id="micSelect"><option value="">Default microphone</option></select></div><div class="captureActions"><button class="record" id="recordBtn">🎙️ RECORD</button><button class="capture" id="captureBtn">CAPTURE TEXT</button></div><div class="status" id="status"></div><div class="saveToast" id="saveToast"><div class="saveTitle" id="saveTitle"></div><div class="saveMeta" id="saveMeta"></div></div></section><div class="footer">Brain Center • Daily 6 + Memory + voice capture</div></div><div class="modal" id="modal"><div class="modalBox"><h2>Brain Center setup</h2><label>Supabase publishable / anon key</label><input id="keyInput" type="password" style="width:100%" placeholder="Paste publishable key"><div class="note">Use only the browser-safe Supabase publishable key.</div><div class="modalBtns"><button class="btn" id="cancelSettings">Cancel</button><button class="btn primary" id="saveSettings">Save</button></div></div></div><script>
const ENDPOINT="https://uvzivnoljpdgmasuzqqv.supabase.co/functions/v1/dynamic-service";const q=id=>document.getElementById(id),getKey=()=>localStorage.getItem("brain_supabase_key")||"";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function setStatus(m,c=""){q("status").textContent=m;q("status").className="status "+c}function openSettings(){q("keyInput").value=getKey();q("modal").classList.add("open")}q("gear").onclick=openSettings;q("cancelSettings").onclick=()=>q("modal").classList.remove("open");q("saveSettings").onclick=()=>{const k=q("keyInput").value.trim();if(k){localStorage.setItem("brain_supabase_key",k);q("modal").classList.remove("open");setStatus("Key saved. Brain Center is ready.","ok");loadDaily6()}};if(!getKey())setTimeout(openSettings,100);async function apiJson(body){const key=getKey();if(!key){openSettings();throw Error("Add your publishable key first.")}const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key,"apikey":key},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}async function apiAudio(blob){const key=getKey();if(!key){openSettings();throw Error("Add your publishable key first.")}const fd=new FormData();fd.append("audio",blob,"brain-dump.webm");const r=await fetch(ENDPOINT,{method:"POST",headers:{"Authorization":"Bearer "+key,"apikey":key},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||"Voice request failed");return d}
function renderArea(area,arr,listId,progressId){const done=arr.filter(x=>x.status==="completed"||x.completed_at).length;q(progressId).textContent=done+"/3";q(listId).innerHTML=arr.length?arr.map(x=>{const isDone=x.status==="completed"||x.completed_at,isActive=!!x.is_now;return `<div class="dailyItem ${isDone?"done":""} ${isActive?"active":""}"><div class="dailyTitle">${esc(x.daily_slot)}. ${esc(x.title)}</div><div class="meta">${esc(x.priority_label)} ${esc(x.priority_score)}${x.estimated_minutes?" • ~"+x.estimated_minutes+" min":""}</div><div class="reason">${esc(x.next_action||"")}</div>${isDone?"<div class='meta'>✓ COMPLETE</div>":isActive?`<div class="activePill">▶ IN PROGRESS</div><div class="rowBtns"><button class="btn doneBtn" onclick="completeItem('${x.id}')">✓ DONE</button></div>`:`<div class="rowBtns"><button class="btn primary" onclick="startItem('${x.id}')">START</button><button class="btn doneBtn" onclick="completeItem('${x.id}')">✓ DONE</button></div>`}</div>`}).join(""):`<div class="meta">Brain needs more ${esc(area)} tasks to fill all 3 slots.</div>`}async function loadDaily6(){if(!getKey())return;try{const d=await apiJson({action:"daily6"});q("dateBadge").textContent=d.date||"Today";renderArea("ELV",d.daily6?.ELV||[],"elvList","elvProgress");renderArea("Gray's",d.daily6?.["Gray's"]||[],"graysList","graysProgress")}catch(e){setStatus("Daily 6 error: "+e.message,"err")}}window.startItem=async id=>{try{await apiJson({action:"start",item_id:id});setStatus("▶ In progress. Stay on this until it's done.","ok");await loadDaily6()}catch(e){setStatus("Start error: "+e.message,"err")}};window.completeItem=async id=>{try{await apiJson({action:"complete",item_id:id});setStatus("Done. Daily 6 updated.","ok");await loadDaily6()}catch(e){setStatus("Done error: "+e.message,"err")}};
let currentNext=null;async function whatsNext(){try{const d=await apiJson({action:"next"});currentNext=d.whats_next?.item||null;if(!currentNext){q("nextCard").classList.remove("show");setStatus("No actionable open items found.","ok");return}const active=!!d.whats_next?.already_active;q("nextTitle").textContent=currentNext.title||"Next task";q("nextMeta").textContent=(active?"▶ ALREADY IN PROGRESS • ":"")+`${currentNext.area||""} • ${currentNext.priority_label||""} ${currentNext.priority_score??""}${currentNext.estimated_minutes?" • ~"+currentNext.estimated_minutes+" min":""}`;q("nextReason").textContent=active?"Finish this before pulling another task. "+(currentNext.next_action||""):(currentNext.ai_reasoning||currentNext.next_action||"");q("nextStart").style.display=active?"none":"";q("nextCard").classList.add("show")}catch(e){setStatus("What's next error: "+e.message,"err")}}q("nextBtn").onclick=whatsNext;q("nextStart").onclick=()=>currentNext&&startItem(currentNext.id);q("nextDone").onclick=()=>currentNext&&completeItem(currentNext.id);
let toastTimer=null;function kindLabel(k){return ({action:"Action",operating_rule:"Operating Rule",reference:"Reference",idea:"Idea"})[k]||"Memory"}function renderCapture(d){const arr=d.items||(d.item?[d.item]:[]);if(!arr.length)return;const first=arr[0],extra=arr.length-1;q("saveTitle").textContent=`✓ Saved to ${first.area||"Brain"} ${kindLabel(first.brain_kind||"action")}${extra?` + ${extra} more`:""}`;q("saveMeta").textContent=first.title||d.message||"Captured.";q("saveToast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>q("saveToast").classList.remove("show"),6500)}q("captureBtn").onclick=async()=>{const raw_input=q("dump").value.trim();if(!raw_input)return setStatus("Give me something to hold first.","err");q("captureBtn").disabled=true;setStatus("Thinking, routing, and prioritizing…");try{const d=await apiJson({raw_input});renderCapture(d);q("dump").value="";setStatus("Got it. It's safe.","ok");await loadDaily6()}catch(e){setStatus("Capture error: "+e.message,"err")}finally{q("captureBtn").disabled=false}};
let stream=null,recorder=null,chunks=[],recording=false,timer=null,startTime=0;async function listMics(){if(!navigator.mediaDevices?.enumerateDevices)return;try{const ds=await navigator.mediaDevices.enumerateDevices(),m=ds.filter(d=>d.kind==="audioinput");q("micSelect").innerHTML='<option value="">Default microphone</option>'+m.map((x,i)=>`<option value="${esc(x.deviceId)}">${esc(x.label||("Microphone "+(i+1)))}</option>`).join("")}catch(_){}}async function startRecording(){try{const id=q("micSelect").value;stream=await navigator.mediaDevices.getUserMedia({audio:id?{deviceId:{exact:id}}:true});await listMics();const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm";recorder=new MediaRecorder(stream,{mimeType:mime});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=sendRecording;recorder.start(1000);recording=true;startTime=Date.now();q("recordBtn").classList.add("live");q("recordBtn").textContent="⏹ STOP";setStatus("Recording… talk naturally. Pauses are fine.");timer=setInterval(()=>q("recordBtn").textContent="⏹ "+Math.floor((Date.now()-startTime)/1000)+"s",1000)}catch(e){setStatus("Microphone error: "+e.message,"err")}}function stopRecording(){if(!recording)return;recording=false;clearInterval(timer);q("recordBtn").disabled=true;setStatus("Uploading audio → transcribing…");recorder.stop();stream?.getTracks().forEach(t=>t.stop())}async function sendRecording(){try{const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});if(blob.size<1000)throw Error("Recording was too short.");const d=await apiAudio(blob);if(d.transcript)q("dump").value=d.transcript;setStatus("Transcription ready. Review it, then press Capture Text.","ok")}catch(e){setStatus("Voice error: "+e.message,"err")}finally{q("recordBtn").disabled=false;q("recordBtn").classList.remove("live");q("recordBtn").textContent="🎙️ RECORD"}}q("recordBtn").onclick=()=>recording?stopRecording():startRecording();navigator.mediaDevices?.addEventListener?.("devicechange",listMics);listMics();if(getKey())loadDaily6();</script></body></html>
