<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garrett Brain Center</title>
<style>body{margin:0;background:#071018;color:#f6f7f9;font-family:system-ui}.w{max-width:900px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo,.gear,.mic{background:#101b28;border:1px solid #293a4c;border-radius:13px;color:white}.logo{padding:12px;font-size:22px}h1{margin:0}.sub,.meta,.reason{color:#9eb0c3}.card{margin-top:24px;background:#0e1925;border:1px solid #293a4c;border-radius:20px;padding:22px}textarea{width:100%;box-sizing:border-box;min-height:190px;background:#09131e;color:white;border:1px solid #293a4c;border-radius:15px;padding:16px;font-size:18px}.actions{display:grid;grid-template-columns:80px 1fr;gap:12px;margin-top:13px}.mic,.cap{height:58px;cursor:pointer}.cap{background:#35d47b;border:0;border-radius:14px;font-weight:900}.gear{padding:12px;cursor:pointer}.status{margin-top:12px;min-height:22px;color:#9eb0c3}.ok{color:#35d47b}.err{color:#ff6b6b}.results{display:none;margin-top:18px}.item{background:#101d2b;border:1px solid #293a4c;border-radius:15px;padding:15px;margin-top:10px}.title{font-weight:800;font-size:18px}.next{margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#0e1925;border:1px solid #293a4c;border-radius:18px;padding:20px;width:min(520px,100%)}input{width:100%;box-sizing:border-box;padding:12px;background:#09131e;color:white;border:1px solid #293a4c;border-radius:10px}.row{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.row button{padding:10px 14px}.note{font-size:12px;color:#9eb0c3;margin-top:8px}@media(max-width:600px){.w{padding:16px 12px}.card{padding:16px}}</style></head>
<body><div class="w"><div class="top"><div class="brand"><div class="logo">🧠</div><div><h1>Brain Center</h1><div class="sub">Get it out of your head. Let the system hold it.</div></div></div><button class="gear" id="gear">⚙️</button></div>
<div class="card"><h2>What's in your head?</h2><textarea id="dump" placeholder="Blurt it out. Don't organize it. That's the Brain's job."></textarea><div class="actions"><button class="mic" id="mic">🎙️</button><button class="cap" id="cap">CAPTURE</button></div><div id="status" class="status"></div><div id="results" class="results"><h3 id="summary"></h3><div id="items"></div></div></div></div>
<div class="modal" id="modal"><div class="box"><h2>Brain Center setup</h2><label>Supabase publishable / anon key</label><input id="key" type="password" placeholder="Paste publishable key"><div class="note">Use only the browser-safe publishable key here. Never use your OpenAI secret or Supabase service-role/secret key.</div><div class="row"><button id="cancel">Cancel</button><button id="save">Save</button></div></div></div>
<script>
const ENDPOINT="https://uvzivnoljpdgmasuzqqv.supabase.co/functions/v1/dynamic-service",q=x=>document.getElementById(x),dump=q("dump"),status=q("status"),results=q("results"),items=q("items"),modal=q("modal");
const getKey=()=>localStorage.getItem("brain_supabase_key")||"";function setStatus(s,c=""){status.textContent=s;status.className="status "+c}function settings(){q("key").value=getKey();modal.classList.add("open")}q("gear").onclick=settings;q("cancel").onclick=()=>modal.classList.remove("open");q("save").onclick=()=>{let k=q("key").value.trim();if(k){localStorage.setItem("brain_supabase_key",k);modal.classList.remove("open");setStatus("Key saved. Brain Center is ready.","ok")}};if(!getKey())setTimeout(settings,100);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
q("cap").onclick=async()=>{let raw_input=dump.value.trim(),key=getKey();if(!raw_input)return setStatus("Give me something to hold first.","err");if(!key){settings();return setStatus("Add your publishable key first.","err")}q("cap").disabled=true;results.style.display="none";setStatus("Thinking, splitting, and prioritizing…");try{let r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key,"apikey":key},body:JSON.stringify({raw_input})}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");let a=d.items||(d.item?[d.item]:[]);q("summary").textContent=d.message||"Captured.";items.innerHTML=a.map((x,i)=>`<div class="item"><div class="title">${i===0?"⚡ ":""}${esc(x.title)}</div><div class="meta">${esc(x.area)} • ${esc(x.item_type)} • ${esc(x.priority_label)} ${esc(x.priority_score)}${x.estimated_minutes?" • ~"+x.estimated_minutes+" min":""}</div><div class="next"><b>Next:</b> ${esc(x.next_action)}</div>${x.ai_reasoning?`<div class="reason">${esc(x.ai_reasoning)}</div>`:""}</div>`).join("");results.style.display="block";dump.value="";setStatus("Got it. It's safe.","ok")}catch(e){setStatus("Error: "+e.message,"err")}finally{q("cap").disabled=false}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,listening=false,base="";if(SR){rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang="en-US";rec.onstart=()=>{q("mic").textContent="⏹️";setStatus("Listening… keep talking. Tap stop when you're done.")};rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)base+=t+" ";else interim+=t}dump.value=(base+interim).trim()};rec.onend=()=>{if(listening){try{rec.start()}catch(e){}}else{q("mic").textContent="🎙️";if(dump.value.trim())setStatus("Dictation captured. Hit CAPTURE when ready.")}};q("mic").onclick=()=>{if(!listening){listening=true;base=dump.value.trim();if(base)base+=" ";try{rec.start()}catch(e){}}else{listening=false;try{rec.stop()}catch(e){}}}}else q("mic").onclick=()=>setStatus("Speech recognition is not available in this browser.","err");
</script></body></html>
